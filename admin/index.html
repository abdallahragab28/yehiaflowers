<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#14452F">
  <title>YehiaFlowers Admin</title>
  <link rel="preconnect" href="https://mfmvoulqbzbptpvbiiok.supabase.co" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/admin.css">
  <script type="module" src="/assets/js/admin/main.js"></script>
</head>
<body>
  <section id="login" class="auth" hidden>
    <div class="auth-card">
      <div class="auth-brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48" width="26" height="26" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M22 40a14 14 0 0 1-2.4-27.8C31 10 34 9 38 4c2 4 4 8.4 4 16 0 11-9.6 20-20 20z"/><path d="M4 42c0-6 3.7-10.7 10.2-12C19 29 24 26 26 24"/></svg></span><b>YehiaFlowers</b></div>
      <h1 data-t="loginTitle"></h1>
      <p class="muted" data-t="loginSub"></p>
      <form id="loginForm" class="stack" novalidate>
        <div class="field"><label for="email" data-t="email"></label><input id="email" class="input" type="email" autocomplete="username" inputmode="email" dir="ltr" required></div>
        <div class="field"><label for="password" data-t="password"></label><input id="password" class="input" type="password" autocomplete="current-password" dir="ltr" required></div>
        <p id="loginErr" class="err" role="alert" hidden></p>
        <button class="btn btn-primary btn-lg btn-block" type="submit" data-t="signIn"></button>
      </form>
      <button type="button" class="btn btn-ghost btn-sm" id="loginLang"></button>
    </div>
  </section>

  <div id="shell" class="shell" hidden>
    <aside class="side">
      <div class="side-brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M22 40a14 14 0 0 1-2.4-27.8C31 10 34 9 38 4c2 4 4 8.4 4 16 0 11-9.6 20-20 20z"/><path d="M4 42c0-6 3.7-10.7 10.2-12C19 29 24 26 26 24"/></svg></span><b>YehiaFlowers</b></div>
      <nav id="sideNav" class="side-nav" aria-label="Main"></nav>
    </aside>
    <div class="main-col">
      <header class="a-top">
        <span class="a-top-brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48" width="20" height="20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M22 40a14 14 0 0 1-2.4-27.8C31 10 34 9 38 4c2 4 4 8.4 4 16 0 11-9.6 20-20 20z"/><path d="M4 42c0-6 3.7-10.7 10.2-12C19 29 24 26 26 24"/></svg></span>YehiaFlowers</span>
        <span class="a-top-actions">
          <button type="button" class="icon-btn" id="themeBtn" aria-label="Theme"></button>
          <button type="button" class="pill-btn" id="langBtn"></button>
          <button type="button" class="pill-btn" id="outBtn" data-t="signOut"></button>
        </span>
      </header>
      <main id="content" class="a-main" tabindex="-1"></main>
    </div>
    <nav id="tabs" class="tabs" aria-label="Main"></nav>
  </div>
</body>
</html>
